# Builds every flavour of the standalone erlc and benchmarks it against the
# BEAM erlc it was built with:
#
#   macOS   aarch64, x86_64            native, benchmarked
#   Linux   aarch64, x86_64            native, static, benchmarked
#   Linux   arm32                      cross-built, static, not benchmarked
#                                      (no runner can execute it)
#   Node.js wasm32                     AOT bundle on the Emscripten AtomVM,
#                                      benchmarked against the same native BEAM
#
# Two benchmarks run per flavour: bench_otp_erlc.py compiles each OTP
# application as one batched invocation (what a real build does), and
# bench_otp_perfile.py compiles a few applications one file per invocation
# (what a save hook does, and where per-file outliers show up).

name: Build erlc binaries

on:
  push:
    branches:
      - main
      - 'w[0-9][0-9]/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AtomVM revision the binaries are built from.
  ATOMVM_REPOSITORY: "pguyot/AtomVM"
  ATOMVM_REF: "w30/jit-edge"
  # OTP 29 is both the build toolchain (the OTP compiler and stdlib beams are
  # packed into the binary) and the benchmark baseline.
  OTP_VERSION: "29"
  # The benchmark corpus: every application in this OTP source tree is compiled
  # by both compilers. Pinned to a tag so the corpus does not drift between
  # runs; only the sources are read, nothing is built from it.
  OTP_SOURCE_REF: "OTP-29.0"
  # Timed runs per application per compiler. One pass over the whole tree is
  # ~65s for BEAM erlc, so 3 runs plus the discovery pass is roughly 15 minutes.
  BENCH_RUNS: "3"
  # The per-file benchmark is quadratically more expensive in process startups,
  # so it runs over four representative applications rather than the whole tree:
  # two large ones and two small ones.
  BENCH_PERFILE_APPS: "kernel stdlib crypto sasl"
  # The wasm32 flavour is not a constant factor slower than the native ones:
  # its cost per module grows superlinearly with the module, so a single large
  # source decides the whole run. Measured wasm32-under-Node vs the native
  # binary, same AtomVM revision:
  #
  #   shell_default.erl     6 KB     3.1s  vs 0.03s
  #   edlin_key.erl        13 KB     8.6s  vs 0.03s
  #   rb.erl               39 KB   191s    vs 0.12s
  #   crypto (2 files)    186 KB  1738s    vs 0.67s   <- on the CI runner
  #
  # That last row is why this job used to run past its timeout without ever
  # reaching kernel and stdlib: the first application alone took half an hour
  # per pass. So the node corpus is one small application, capped by source
  # size -- 9 of sasl's 17 modules, none of them pathological.
  BENCH_NODE_APPS: "sasl"
  BENCH_NODE_MAX_BYTES: "10000"
  # PackBEAM and uf2tool are rebar3 projects, so CMake requires rebar3 to
  # configure AtomVM at all.
  REBAR3_VERSION: "3.25.1"
  MBEDTLS_VERSION: "3.6.4"
  # Only used by the arm32 cross build, which has no distro packages to use.
  ZLIB_VERSION: "1.3.1"
  PCRE2_VERSION: "10.45"

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # The benchmark bounds each compiler invocation itself; this only stops a
    # runner from idling for hours if something below that wedges.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "ubuntu-22.04", arch: "x86_64" }
          - { os: "ubuntu-24.04", arch: "x86_64" }
          - { os: "ubuntu-22.04-arm", arch: "aarch64" }
          - { os: "ubuntu-24.04-arm", arch: "aarch64" }
          # 32-bit ARM is cross-built from the aarch64 runner: Graviton cannot
          # execute AArch32 at all, so this flavour is built and checked but
          # never run, hence no smoke test and no benchmark.
          - { os: "ubuntu-24.04-arm", arch: "arm32", cross: true,
              triple: "arm-linux-gnueabihf", debian_arch: "armhf" }
          - { os: "macos-14", arch: "aarch64" }
          - { os: "macos-15", arch: "aarch64" }
          - { os: "macos-15-intel", arch: "x86_64" }
          - { os: "macos-26", arch: "aarch64" }
          - { os: "macos-26-intel", arch: "x86_64" }

    steps:
      - name: Checkout atomvm_erlc
        uses: actions/checkout@v4

      - name: Checkout AtomVM (${{ env.ATOMVM_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMVM_REPOSITORY }}
          ref: ${{ env.ATOMVM_REF }}
          path: AtomVM

      - name: Record AtomVM revision
        run: |
          echo "ATOMVM_SHA=$(git -C AtomVM rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Erlang/OTP ${{ env.OTP_VERSION }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: loose

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross }}" = "true" ]; then
            # No :armhf dev packages here on purpose -- the runner's apt sources
            # are not guaranteed to carry that architecture. The C libraries are
            # cross-built from source in the next step instead; all that is
            # needed from apt is the cross toolchain itself.
            sudo apt-get install -y cmake ninja-build gperf \
              "crossbuild-essential-${{ matrix.debian_arch }}"
          else
            sudo apt-get install -y cmake ninja-build gperf zlib1g-dev libmbedtls-dev libpcre2-dev
          fi

      - name: Cross-build arm32 dependencies
        if: matrix.cross
        env:
          CROSS_TRIPLE: ${{ matrix.triple }}
        run: ./build_arm32_deps.sh "${{ github.workspace }}/arm32-sysroot"

      # Homebrew ships Mbed-TLS as shared libraries only, so build a static one
      # from source. Mbed-TLS is not optional for this binary: the OTP compiler
      # calls erlang:md5/1 for every module it emits (beam_asm:module_md5/1),
      # and AtomVM implements that on top of Mbed-TLS.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja gperf
          curl -fsSL -o mbedtls.tar.bz2 \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBEDTLS_VERSION}/mbedtls-${MBEDTLS_VERSION}.tar.bz2"
          tar xf mbedtls.tar.bz2
          # Install to a dedicated prefix rather than /usr/local, which is the
          # Homebrew prefix on Intel runners: adding that to CMake's search
          # path could pull in a Homebrew zlib and make the binary
          # non-portable.
          cmake -S "mbedtls-${MBEDTLS_VERSION}" -B mbedtls-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/mbedtls-prefix" \
            -DUSE_STATIC_MBEDTLS_LIBRARY=On \
            -DUSE_SHARED_MBEDTLS_LIBRARY=Off \
            -DENABLE_TESTING=Off \
            -DENABLE_PROGRAMS=Off
          cmake --build mbedtls-build
          cmake --install mbedtls-build

      # AVM_STATIC_MBEDTLS only takes effect on the find_library path;
      # CMAKE_DISABLE_FIND_PACKAGE_MbedTLS keeps CMake off the package path,
      # which would otherwise hard-error when static linking is requested.
      # Linux additionally links libc statically for a fully standalone binary;
      # macOS has no static libc, so libSystem stays dynamic there.
      - name: Configure AtomVM
        run: |
          # cmake is piped into tee below, so without pipefail the step takes
          # tee's exit status and a failed configure is reported as success --
          # the build then dies on a missing build.ninja with no visible cause.
          set -o pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            # Everything the cross build links against lives in the sysroot the
            # previous step populated. The library paths are pinned explicitly
            # rather than left to find_library so a host-architecture archive
            # can never be picked up, and -I is needed on top of the find root
            # because check_symbol_exists() only searches the compiler's own
            # include path.
            SYSROOT="${{ github.workspace }}/arm32-sysroot"
            PREFIX="${SYSROOT}/usr"
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=${SYSROOT}/toolchain.cmake"
            EXTRA="$EXTRA -DCMAKE_C_FLAGS=-I${PREFIX}/include"
            EXTRA="$EXTRA -DCMAKE_EXE_LINKER_FLAGS=-static"
            EXTRA="$EXTRA -DZLIB_INCLUDE_DIR=${PREFIX}/include"
            EXTRA="$EXTRA -DZLIB_LIBRARY=${PREFIX}/lib/libz.a"
            EXTRA="$EXTRA -DPCRE2_INCLUDE_DIR=${PREFIX}/include"
            EXTRA="$EXTRA -DPCRE2_8_LIBRARY=${PREFIX}/lib/libpcre2-8.a"
            EXTRA="$EXTRA -DMBEDCRYPTO=${PREFIX}/lib/libmbedcrypto.a"
            EXTRA="$EXTRA -DMBEDX509=${PREFIX}/lib/libmbedx509.a"
            EXTRA="$EXTRA -DMBEDTLS=${PREFIX}/lib/libmbedtls.a"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # CMake finds the shared zlib by default, which -static cannot
            # link. Ask the compiler for the static archive zlib1g-dev ships,
            # which avoids hardcoding the multiarch triplet.
            ZLIB_A="$(${CC:-gcc} -print-file-name=libz.a)"
            case "$ZLIB_A" in
              /*) ;;
              *)
                echo "FAIL: libz.a not found, zlib1g-dev is required"
                exit 1
                ;;
            esac
            EXTRA="-DCMAKE_EXE_LINKER_FLAGS=-static"
            EXTRA="$EXTRA -DZLIB_INCLUDE_DIR=/usr/include"
            EXTRA="$EXTRA -DZLIB_LIBRARY=${ZLIB_A}"
            # Same story for PCRE2 (the re module): find_library would pick
            # the shared object, which -static cannot link.
            PCRE2_A="$(${CC:-gcc} -print-file-name=libpcre2-8.a)"
            case "$PCRE2_A" in
              /*) EXTRA="$EXTRA -DPCRE2_8_LIBRARY=${PCRE2_A}" ;;
            esac
          else
            # check_symbol_exists() only searches the compiler's default
            # include path, so point CMake at the static Mbed-TLS built above.
            # Pin zlib to the SDK too, so a Homebrew copy cannot slip in and
            # leave the binary depending on a library users will not have.
            PREFIX="${{ github.workspace }}/mbedtls-prefix"
            SDK="$(xcrun --show-sdk-path)"
            EXTRA="-DCMAKE_C_FLAGS=-I${PREFIX}/include"
            EXTRA="$EXTRA -DCMAKE_LIBRARY_PATH=${PREFIX}/lib"
            EXTRA="$EXTRA -DZLIB_INCLUDE_DIR=${SDK}/usr/include"
            EXTRA="$EXTRA -DZLIB_LIBRARY=${SDK}/usr/lib/libz.tbd"
          fi
          cmake -S AtomVM -B AtomVM/build.release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DAVM_DISABLE_JIT=OFF \
            -DAVM_PRECOMPILED_TARGETS="${{ matrix.arch }}" \
            -DAVM_STATIC_MBEDTLS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_MbedTLS=ON \
            $EXTRA 2>&1 | tee configure.log
          # Mbed-TLS is only a warning to AtomVM, but this binary cannot work
          # without it: the OTP compiler calls erlang:md5/1 for every module.
          # Fail here rather than ship a silently crypto-less erlc.
          if grep -q "Could NOT find MbedTLS" configure.log; then
            echo "FAIL: Mbed-TLS was not detected, erlang:md5/1 would be unavailable"
            exit 1
          fi
          grep -m1 "Found MbedTLS with" configure.log

      - name: Build AtomVM
        run: cmake --build AtomVM/build.release --target AtomVM PackBEAM atomvmlib

      - name: Build erlc
        env:
          ATOMVM_BUILD: ${{ github.workspace }}/AtomVM/build.release
          TARGET: ${{ matrix.arch }}
        run: ./build_erlc.sh

      - name: Verify the binary is self-contained
        run: |
          BIN=_build/erlc
          file "$BIN"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # A fully static binary has no PT_INTERP segment and no DT_NEEDED
            # entries. readelf reads the ELF instead of running it, so this also
            # works for the arm32 binary, which the aarch64 host cannot execute
            # and ldd therefore cannot inspect.
            if readelf -lW "$BIN" | grep -q "INTERP"; then
              echo "FAIL: binary requests a dynamic loader:"
              readelf -lW "$BIN" | grep "INTERP"
              exit 1
            fi
            if readelf -dW "$BIN" 2>/dev/null | grep -q "NEEDED"; then
              echo "FAIL: binary still has dynamic dependencies:"
              readelf -dW "$BIN" | grep "NEEDED"
              exit 1
            fi
            echo "OK: statically linked"
            if [ "${{ matrix.cross }}" = "true" ]; then
              # A cross build that silently fell back to the host compiler would
              # still be static, so check the ELF really targets 32-bit ARM.
              if ! readelf -hW "$BIN" | grep -qE 'Machine:.*\bARM\b'; then
                echo "FAIL: not a 32-bit ARM binary:"
                readelf -hW "$BIN" | grep -E 'Class|Machine'
                exit 1
              fi
              echo "OK: 32-bit ARM"
            fi
          else
            otool -L "$BIN"
            # Everything outside /usr/lib and /System ships with Homebrew or
            # MacPorts and would not exist on a user's machine.
            if otool -L "$BIN" | tail -n +2 | grep -vqE '^[[:space:]]+(/usr/lib|/System)/'; then
              echo "FAIL: binary depends on non-system libraries:"
              otool -L "$BIN" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib|/System)/'
              exit 1
            fi
            echo "OK: only system libraries"
          fi

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: ./smoke_test.sh "${GITHUB_WORKSPACE}/_build/erlc"

      # Fetched late, and shallow: this is a large repository that is only
      # needed as benchmark input, so nothing earlier has to wait on it.
      - name: Checkout Erlang/OTP ${{ env.OTP_SOURCE_REF }} source
        if: ${{ !matrix.cross }}
        uses: actions/checkout@v4
        with:
          repository: erlang/otp
          ref: ${{ env.OTP_SOURCE_REF }}
          path: otp
          fetch-depth: 1

      # A source checkout is not the whole corpus: two of stdlib's largest
      # modules are generated during an OTP build and gitignored, so globbing
      # lib/stdlib/src silently omits them. unicode_util.erl matters most --
      # 898 KB, the most expensive module in the tree, and one of the few where
      # AtomVM erlc loses to BEAM erlc -- so leaving it out flatters the
      # results. These are the same two generators OTP's own makefiles run, and
      # they take about a second each.
      - name: Generate stdlib's build-time sources
        if: ${{ !matrix.cross }}
        run: ./generate_otp_sources.sh otp

      # The benchmarks exit non-zero when AtomVM erlc is slower in total, which
      # is a result to report rather than a build failure -- hence `|| true`.
      - name: Benchmark whole applications
        if: ${{ !matrix.cross }}
        run: |
          python3 -u bench_otp_erlc.py \
            --otp otp \
            --runs "${BENCH_RUNS}" \
            --atomvm-erlc "${GITHUB_WORKSPACE}/_build/erlc" \
            --beam-erlc "$(command -v erlc)" 2>&1 | tee bench.txt || true
          {
            echo "### ${{ matrix.os }} (${{ matrix.arch }}) -- whole applications"
            echo
            echo "AtomVM \`${ATOMVM_SHA}\` (\`${ATOMVM_REF}\`) vs BEAM erlc from OTP ${OTP_VERSION},"
            echo "compiling every application in the ${OTP_SOURCE_REF} source tree,"
            echo "one batched invocation per application."
            echo "Ratios above 1.00x mean AtomVM erlc is faster."
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark file by file
        if: ${{ !matrix.cross }}
        run: |
          python3 -u bench_otp_perfile.py \
            --otp otp \
            --runs "${BENCH_RUNS}" \
            --atomvm-erlc "${GITHUB_WORKSPACE}/_build/erlc" \
            --beam-erlc "$(command -v erlc)" \
            ${BENCH_PERFILE_APPS} 2>&1 | tee bench-perfile.txt || true
          {
            echo "### ${{ matrix.os }} (${{ matrix.arch }}) -- file by file"
            echo
            echo "One compiler invocation per file over ${BENCH_PERFILE_APPS},"
            echo "so every file pays VM startup on its own."
            echo "Ratios above 1.00x mean AtomVM erlc is faster."
            echo
            echo '```'
            cat bench-perfile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload erlc binary
        uses: actions/upload-artifact@v4
        with:
          name: erlc-${{ matrix.os }}-${{ matrix.arch }}
          path: _build/erlc
          if-no-files-found: error

      - name: Upload benchmark results
        if: ${{ !matrix.cross }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bench.txt
            bench-perfile.txt
          if-no-files-found: error

  node:
    name: node (wasm32)
    # The Emscripten output (AtomVM.mjs + AtomVM.wasm + erlc.avm) is portable,
    # so a single host build produces an artifact that runs under Node anywhere.
    runs-on: ubuntu-24.04
    # The build itself takes about five minutes; the rest is the (deliberately
    # small, see BENCH_NODE_APPS) benchmark, which is additionally capped step
    # by step so a single pathological module cannot eat the whole budget.
    timeout-minutes: 90

    steps:
      - name: Checkout atomvm_erlc
        uses: actions/checkout@v4

      - name: Checkout AtomVM (${{ env.ATOMVM_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMVM_REPOSITORY }}
          ref: ${{ env.ATOMVM_REF }}
          path: AtomVM

      - name: Record AtomVM revision
        run: echo "ATOMVM_SHA=$(git -C AtomVM rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Erlang/OTP ${{ env.OTP_VERSION }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: loose

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf zlib1g-dev libmbedtls-dev

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # Host build: only the Erlang-side pieces are needed -- the wasm32
      # precompiler beams, PackBEAM, and the emscripten library precompiled to
      # wasm32. No native AtomVM binary is produced or required, so wasm32 is
      # added to AVM_PRECOMPILED_TARGETS and JIT DWARF is left off so wasm32 is
      # actually emitted.
      - name: Configure host AtomVM (wasm32 precompiled library)
        run: |
          cmake -S AtomVM -B AtomVM/build.host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAVM_DISABLE_JIT=OFF \
            -DAVM_DISABLE_JIT_DWARF=ON \
            -DAVM_PRECOMPILED_TARGETS=wasm32

      - name: Build wasm32 library, PackBEAM and precompiler
        run: cmake --build AtomVM/build.host --target atomvmlib-emscripten PackBEAM

      # Emscripten runtime: the AtomVM.mjs + AtomVM.wasm that runs the wasm32 AOT
      # code under Node. JIT is left enabled: the runtime registers the AOT wasm
      # functions through addFunction at load, which needs the JIT link flags.
      - name: Configure Emscripten AtomVM
        run: |
          emcmake cmake -S AtomVM/src/platforms/emscripten -B AtomVM/build.emsdk \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DAVM_DISABLE_JIT=OFF

      - name: Build Emscripten AtomVM
        run: cmake --build AtomVM/build.emsdk --target AtomVM

      - name: Build erlc (Node.js)
        env:
          ATOMVM_BUILD: ${{ github.workspace }}/AtomVM/build.host
          ATOMVM_MJS_DIR: ${{ github.workspace }}/AtomVM/build.emsdk/src
        run: ./build_erlc_node.sh

      # erlc.mjs carries a `node` shebang, so the benchmarks can drive it as a
      # plain executable; the smoke test uses the same path to prove that.
      - name: Smoke test (Node.js)
        run: ./smoke_test.sh "${GITHUB_WORKSPACE}/_build/node/erlc.mjs"

      - name: Checkout Erlang/OTP ${{ env.OTP_SOURCE_REF }} source
        uses: actions/checkout@v4
        with:
          repository: erlang/otp
          ref: ${{ env.OTP_SOURCE_REF }}
          path: otp
          fetch-depth: 1

      # Same generated stdlib sources as the native jobs. The current node
      # corpus (sasl, capped) does not reach them, but running this here keeps
      # "the OTP source tree" meaning one thing across both jobs, so widening
      # BENCH_NODE_APPS later cannot silently benchmark an incomplete stdlib.
      - name: Generate stdlib's build-time sources
        run: ./generate_otp_sources.sh otp

      # Scoped to BENCH_NODE_APPS, capped by BENCH_NODE_MAX_BYTES, and to a
      # single timed run. The baseline is the same native BEAM erlc as
      # everywhere else, so a row here is directly comparable to the native
      # rows for the same modules -- but not to the native jobs' totals, which
      # cover the whole tree uncapped.
      #
      # --timeout is per invocation and a whole application is one invocation
      # here. An overrun is reported as an untimed row rather than waited on;
      # timeout-minutes then bounds the step itself, because a batch that times
      # out sends the script into its per-file discovery fallback.
      #
      # python3 -u so the rows reach the live log as they are produced rather
      # than sitting in a pipe buffer until the step ends -- with a flavour this
      # slow, the buffered version showed nothing at all for hours.
      - name: Benchmark whole applications vs native BEAM erlc
        timeout-minutes: 30
        run: |
          python3 -u bench_otp_erlc.py \
            --otp otp \
            --runs 1 \
            --timeout 300 \
            --max-bytes "${BENCH_NODE_MAX_BYTES}" \
            --atomvm-erlc "${GITHUB_WORKSPACE}/_build/node/erlc.mjs" \
            --beam-erlc "$(command -v erlc)" \
            ${BENCH_NODE_APPS} 2>&1 | tee bench.txt || true
          {
            echo "### node (wasm32) -- whole applications"
            echo
            echo "AtomVM \`${ATOMVM_SHA}\` (\`${ATOMVM_REF}\`) AOT-compiled to wasm32 and run"
            echo "under Node, vs the **native** BEAM erlc from OTP ${OTP_VERSION} on the same"
            echo "runner, over ${BENCH_NODE_APPS} of ${OTP_SOURCE_REF}, modules up to"
            echo "${BENCH_NODE_MAX_BYTES} bytes only."
            echo "Ratios above 1.00x mean AtomVM erlc is faster."
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark file by file vs native BEAM erlc
        timeout-minutes: 30
        run: |
          python3 -u bench_otp_perfile.py \
            --otp otp \
            --runs 1 \
            --timeout 300 \
            --max-bytes "${BENCH_NODE_MAX_BYTES}" \
            --atomvm-erlc "${GITHUB_WORKSPACE}/_build/node/erlc.mjs" \
            --beam-erlc "$(command -v erlc)" \
            ${BENCH_NODE_APPS} 2>&1 | tee bench-perfile.txt || true
          {
            echo "### node (wasm32) -- file by file"
            echo
            echo "One invocation per file over ${BENCH_NODE_APPS} (modules up to"
            echo "${BENCH_NODE_MAX_BYTES} bytes), against the same native BEAM erlc."
            echo "This is where the wasm cost shows per module: the ratio is not a"
            echo "constant, it grows with the size of the module."
            echo "Ratios above 1.00x mean AtomVM erlc is faster."
            echo
            echo '```'
            cat bench-perfile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Node.js erlc bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erlc-node-wasm32
          path: |
            _build/node/erlc.mjs
            _build/node/erlc.avm
            _build/node/AtomVM.mjs
            _build/node/AtomVM.wasm
          if-no-files-found: warn

      # always(), and warn rather than error on missing files: both benchmark
      # steps tee as they go, so even a step that hits its cap leaves a partial
      # file worth keeping -- which is exactly the run where the numbers are
      # most interesting.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-node-wasm32
          path: |
            bench.txt
            bench-perfile.txt
          if-no-files-found: warn
