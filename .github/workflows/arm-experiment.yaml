#
# Temporary experiment: bisect the Linux-aarch64 performance gap
# (bench 0.66x vs 0.85-1.11x on Apple silicon) across toolchain and
# build-flag variants. Benchmarks a fast subset (stdlib + kernel).

name: ARM Linux experiment

on:
  push:
    branches:
      - 'w29/arm-experiment'
  workflow_dispatch:

env:
  ATOMVM_REPOSITORY: "pguyot/AtomVM"
  ATOMVM_REF: "w27/jit-pinned-regs"
  OTP_VERSION: "29"
  OTP_SOURCE_REF: "OTP-29.0"
  REBAR3_VERSION: "3.25.1"

jobs:
  experiment:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: "gcc-base",   cc: "gcc",   lto: "OFF", reloc: "OFF", smp: "ON", mtune: "" }
          - { variant: "gcc-mtune",  cc: "gcc",   lto: "OFF", reloc: "OFF", smp: "ON", mtune: "neoverse-n2" }

    steps:
      - name: Checkout atomvm_erlc
        uses: actions/checkout@v4

      - name: Checkout AtomVM (${{ env.ATOMVM_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMVM_REPOSITORY }}
          ref: ${{ env.ATOMVM_REF }}
          path: AtomVM

      - name: Install Erlang/OTP ${{ env.OTP_VERSION }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: loose

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf zlib1g-dev libmbedtls-dev
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get install -y clang lld
          fi

      - name: Configure and build AtomVM
        run: |
          if [ "${{ matrix.cc }}" = "clang" ]; then
            TOOLCHAIN="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          else
            TOOLCHAIN=""
          fi
          if [ "${{ matrix.reloc }}" = "ON" ]; then
            RELOC="-DAVM_JIT_RELOC=ON -DAVM_PRECOMPILED_TARGETS=aarch64+reloc"
          else
            RELOC="-DAVM_PRECOMPILED_TARGETS=aarch64"
          fi
          if [ "${{ matrix.smp }}" = "OFF" ]; then
            SMP="-DAVM_DISABLE_SMP=ON"
          else
            SMP=""
          fi
          if [ -n "${{ matrix.mtune }}" ]; then
            SMP="$SMP -DCMAKE_C_FLAGS=-mtune=${{ matrix.mtune }}"
          fi
          cmake -S AtomVM -B AtomVM/build.release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.lto }} \
            -DAVM_DISABLE_JIT=OFF \
            -DAVM_STATIC_MBEDTLS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_MbedTLS=ON \
            $TOOLCHAIN $RELOC $SMP
          cmake --build AtomVM/build.release --target AtomVM PackBEAM atomvmlib

      - name: Build erlc
        env:
          ATOMVM_BUILD: ${{ github.workspace }}/AtomVM/build.release
        run: |
          if [ "${{ matrix.reloc }}" = "ON" ]; then
            export TARGET="aarch64+reloc"
          else
            export TARGET="aarch64"
          fi
          ./build_erlc.sh

      - name: Checkout Erlang/OTP ${{ env.OTP_SOURCE_REF }} source
        uses: actions/checkout@v4
        with:
          repository: erlang/otp
          ref: ${{ env.OTP_SOURCE_REF }}
          path: otp
          fetch-depth: 1

      - name: Perf profile (gcc-perf lane)
        if: matrix.variant == 'gcc-perf'
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic || true
          echo 1 | sudo tee /proc/sys/kernel/perf_event_paranoid || true
          PERF="$(ls /usr/lib/linux-tools*/*/perf /usr/lib/linux-tools/*/perf 2>/dev/null | head -1 || command -v perf)"
          echo "using perf: $PERF"
          "$PERF" version || true
          # one batched kernel-app compile under perf, mirroring the bench setup
          python3 - "$PERF" <<'PYEOF2'
          import glob, subprocess, sys, tempfile, os
          perf = sys.argv[1]
          otp = "otp"
          inc = []
          for d in sorted(glob.glob(otp + "/lib/*/include")):
              inc += ["-I", d]
          inc += ["-I", otp + "/erts/include", "-I", otp + "/lib"]
          inc += ["-I", otp + "/lib/kernel/src", "-I", otp + "/lib/kernel/include"]
          files = sorted(glob.glob(otp + "/lib/kernel/src/*.erl"))
          out = tempfile.mkdtemp()
          erlc = os.environ["GITHUB_WORKSPACE"] + "/_build/erlc"
          cmd = [perf, "record", "-F", "499", "-g", "-o", "perf.data", "--", erlc, "-o", out] + inc + files
          subprocess.run(cmd, timeout=1200)
          PYEOF2
          "$PERF" report --stdio -i perf.data --no-children --percent-limit 0.5 2>/dev/null | head -100 | tee perf-report.txt
          {
            echo "### gcc-perf: perf report (kernel app batch)"
            echo '```'
            cat perf-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$PERF" stat -e task-clock,cycles,instructions,branches,branch-misses,cache-misses,L1-dcache-load-misses -- "${GITHUB_WORKSPACE}/_build/erlc" -o /tmp/perfstatout -I otp/lib -I otp/lib/kernel/src otp/lib/kernel/src/*.erl 2>&1 | tail -20 | tee -a perf-report.txt || true

      - name: Upload perf report
        if: matrix.variant == 'gcc-perf'
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.txt
          if-no-files-found: warn

      - name: Benchmark subset
        if: matrix.variant != 'gcc-perf'
        run: |
          python3 bench_otp_erlc.py \
            --otp otp \
            --runs 2 \
            --atomvm-erlc "${GITHUB_WORKSPACE}/_build/erlc" \
            --beam-erlc "$(command -v erlc)" \
            stdlib kernel 2>&1 | tee bench.txt || true
          {
            echo "### ${{ matrix.variant }}"
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: matrix.variant != 'gcc-perf'
        uses: actions/upload-artifact@v4
        with:
          name: bench-experiment-${{ matrix.variant }}
          path: bench.txt
          if-no-files-found: error
